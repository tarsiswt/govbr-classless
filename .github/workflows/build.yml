name: Build CSS

on:
  push:
    branches: [main]
    paths:
      - govbr-classless.css
      - components.css

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run build

      - name: Commit minified output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/govbr-classless.min.css
          git diff --cached --quiet || git commit -m "build: minify CSS [skip ci]"
          git push
